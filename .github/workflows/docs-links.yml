name: docs links

# The links of the documentation point to external sites that can be down for
# a while. Checking them in the pull request CI would block pull requests that
# change nothing in the docs, so they are checked once a week instead.
on:
    workflow_dispatch: # allows manual triggering
    schedule:
        - cron: "0 3 * * 1" # Mondays at 03:00

jobs:
    linkcheck:
        runs-on: ubuntu-latest
        defaults:
            run:
                shell: bash -l {0}
                working-directory: docs
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Mamba and samurai-doc env installation
              uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
              with:
                  environment-file: docs/environment.yml
                  environment-name: samurai-doc
                  cache-environment: true
                  cache-environment-key: docs-${{ runner.os }}-${{ hashFiles('docs/environment.yml') }}

            - name: Doxygen
              run: doxygen

            - name: Sphinx linkcheck
              run: sphinx-build -b linkcheck -W --keep-going source build/linkcheck
