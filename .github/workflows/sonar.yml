name: SonarQube Cloud

# CI-based SonarQube Cloud analysis, with the coverage of the C++ tests and of
# the Python tools.
#
# - Push to main: build the coverage reports (coverage.yml) and scan main.
# - Pull request: ci.yml runs coverage.yml and uploads its reports. This
#   workflow runs once ci.yml completes, from the default branch and with
#   access to SONAR_TOKEN, downloads the reports and scans the pull request.
#   Pull requests come from forks, which never get secrets in ci.yml itself.
#
# The pull request code and the artifact built from it are untrusted here, so
# this workflow never executes them: the scan configuration and the script
# below come from the default branch, Python runs isolated (-I) from outside
# the checkout, and the compilation database is rewritten to use the trusted
# compiler installed here with only header and macro options (the C++ analyzer
# runs the compiler of each entry). SONAR_TOKEN is only given to the scan step.
#
# Without the SONAR_TOKEN secret, every job is skipped and the workflow passes.
on:
    push:
        branches: [main]
    workflow_run:
        workflows: ["samurai CI"]
        types: [completed]

permissions:
    contents: read

# Analyses of main run one after the other, in push order.
concurrency:
    group: ${{ github.event_name == 'push' && 'sonar-main' || format('sonar-{0}', github.run_id) }}
    cancel-in-progress: false

jobs:
    token:
        runs-on: ubuntu-latest
        outputs:
            available: ${{ steps.check.outputs.available }}
        steps:
            - name: Check for the SonarQube Cloud token
              id: check
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
              run: |
                  if [ -n "$SONAR_TOKEN" ]; then
                      echo "available=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "::notice::The SONAR_TOKEN secret is not set: no SonarQube Cloud analysis."
                      echo "available=false" >> "$GITHUB_OUTPUT"
                  fi

    coverage:
        needs: [token]
        if: github.event_name == 'push' && needs.token.outputs.available == 'true'
        uses: ./.github/workflows/coverage.yml

    scan:
        needs: [token, coverage]
        if: >-
            !cancelled()
            && needs.token.outputs.available == 'true'
            && ((github.event_name == 'push' && needs.coverage.result == 'success')
                || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request'))
        runs-on: ubuntu-latest
        permissions:
            contents: read
            # Download the artifact of the ci.yml run.
            actions: read
            # Read the pull request of the ci.yml run.
            pull-requests: read
        env:
            RUN_ID: ${{ github.event.workflow_run.id || github.run_id }}
        steps:
            # A pull request whose coverage job did not run (documentation
            # only) or failed has no reports: nothing to scan.
            - name: Look for the coverage reports
              id: artifact
              if: github.event_name == 'workflow_run'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?name=sonar-inputs" --jq '.total_count')
                  if [ "$count" = 0 ]; then
                      echo "::notice::Run $RUN_ID has no sonar-inputs artifact: no analysis."
                      echo "found=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "found=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Download the coverage reports
              if: steps.artifact.outputs.found != 'false'
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: sonar-inputs
                  path: ${{ runner.temp }}/artifact
                  run-id: ${{ env.RUN_ID }}
                  github-token: ${{ github.event_name == 'workflow_run' && github.token || '' }}

            # The pull request number and merge commit come from the artifact:
            # check them against the API and keep the analysis only if the
            # pull request head is still the commit that ci.yml tested.
            - name: Pull request
              id: pr
              if: github.event_name == 'workflow_run' && steps.artifact.outputs.found == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
                  HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
              run: |
                  metadata="$RUNNER_TEMP/artifact/sonar-inputs/pull-request.json"
                  number=$(jq -r '.number' "$metadata")
                  merge_sha=$(jq -r '.merge_sha' "$metadata")
                  if ! [[ "$number" =~ ^[0-9]+$ && "$merge_sha" =~ ^[0-9a-f]{40}$ ]]; then
                      echo "::error::Invalid pull request metadata in the artifact."
                      exit 1
                  fi
                  pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number")
                  head_sha=$(jq -r '.head.sha' <<< "$pr")
                  branch=$(jq -r '.head.ref' <<< "$pr")
                  base=$(jq -r '.base.ref' <<< "$pr")
                  if [ "$head_sha" != "$HEAD_SHA" ]; then
                      echo "::notice::Pull request #$number has moved past $HEAD_SHA: no analysis."
                      echo "scan=false" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  if ! [[ "$branch" =~ ^[A-Za-z0-9._/-]+$ && "$base" =~ ^[A-Za-z0-9._/-]+$ ]]; then
                      echo "::notice::Unsupported branch name in pull request #$number: no analysis."
                      echo "scan=false" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  {
                      echo "scan=true"
                      echo "number=$number"
                      echo "branch=$branch"
                      echo "base=$base"
                      echo "head-sha=$head_sha"
                      echo "merge-sha=$merge_sha"
                  } >> "$GITHUB_OUTPUT"

            - name: Decide
              id: go
              if: steps.artifact.outputs.found != 'false' && steps.pr.outputs.scan != 'false'
              run: echo "scan=true" >> "$GITHUB_OUTPUT"

            # The default branch (workflow_run) or the pushed commit (push).
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              if: steps.go.outputs.scan == 'true'
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Keep the trusted scan configuration
              if: steps.go.outputs.scan == 'true'
              run: |
                  mkdir -p "$RUNNER_TEMP/trusted"
                  cp sonar-project.properties .github/scripts/sonar_compile_db.py "$RUNNER_TEMP/trusted/"

            # The headers the analyzer parses: those of the samurai environment
            # (from the default branch), the compiler and PETSc, as in coverage.yml.
            - name: Mamba and samurai env installation
              if: steps.go.outputs.scan == 'true'
              uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
              with:
                  environment-file: conda/environment.yml
                  environment-name: samurai-env
                  cache-environment: true
                  cache-environment-key: ${{ runner.os }}-${{ hashFiles('conda/environment.yml') }}

            - name: Compiler and PETSc installation
              if: steps.go.outputs.scan == 'true'
              shell: bash -l {0}
              run: |
                  micromamba install -y cxx-compiler petsc pkg-config

            # Same commit as the one ci.yml tested: the merge of the pull request
            # into its base. Checked out, never built nor run.
            - name: Check out the pull request
              if: steps.go.outputs.scan == 'true' && github.event_name == 'workflow_run'
              env:
                  MERGE_SHA: ${{ steps.pr.outputs.merge-sha }}
              run: |
                  git fetch --no-tags origin "$MERGE_SHA"
                  git checkout --force --detach "$MERGE_SHA"

            - name: Put the scan inputs in place
              if: steps.go.outputs.scan == 'true'
              shell: bash -l {0}
              run: |
                  artifact="$RUNNER_TEMP/artifact"
                  cp "$RUNNER_TEMP/trusted/sonar-project.properties" sonar-project.properties
                  rm -rf sonar-inputs build build-bench
                  mkdir sonar-inputs
                  cp "$artifact/sonar-inputs/cpp-coverage.xml" "$artifact/sonar-inputs/python-coverage.xml" sonar-inputs/
                  # Headers generated or fetched at configure time (googletest,
                  # Google Benchmark), at the paths of the compilation database.
                  for dir in build build-bench; do
                      if [ -d "$artifact/$dir" ]; then
                          cp -R --no-dereference "$artifact/$dir" "$dir"
                      fi
                  done
                  compiler=$(command -v "$CXX")
                  cd "$RUNNER_TEMP"
                  python3 -I trusted/sonar_compile_db.py sanitize \
                      --workspace "$GITHUB_WORKSPACE" \
                      --compiler "$compiler" \
                      --output "$GITHUB_WORKSPACE/sonar-inputs/compile_commands.json" \
                      artifact/sonar-inputs/compile_commands.json

            - name: SonarQube Cloud scan of main
              if: steps.go.outputs.scan == 'true' && github.event_name == 'push'
              uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

            - name: SonarQube Cloud scan of the pull request
              if: steps.go.outputs.scan == 'true' && github.event_name == 'workflow_run'
              uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
              with:
                  args: >
                      -Dsonar.pullrequest.key=${{ steps.pr.outputs.number }}
                      -Dsonar.pullrequest.branch=${{ steps.pr.outputs.branch }}
                      -Dsonar.pullrequest.base=${{ steps.pr.outputs.base }}
                      -Dsonar.scm.revision=${{ steps.pr.outputs.head-sha }}
