# The snippet outputs are written by the update_snippet_outputs target and must
# stay byte-identical to the output of the programs (tabs, trailing spaces).
exclude: _output\.txt$
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # - id: check-added-large-files
      - id: check-case-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: no-commit-to-branch
      - id: mixed-line-ending
        args: ["--fix=lf"]
        description: Forces to replace line ending by the UNIX 'lf' character.
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.5
    hooks:
      - id: forbid-tabs
      - id: remove-tabs
        args: [--whitespaces-count, "4"]
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.2
    hooks:
      - id: clang-format
        files: .*\.[hc]pp$
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2
        # The hook needs Node 22 or later; pin it rather than rely on the
        # runner's system Node. It reads .markdownlint.json, as Codacy does.
        language_version: 24.21.0
        # CHANGELOG.md is written by release-please. The PR template starts
        # at a level-2 heading (MD041) because it becomes a PR body.
        exclude: ^(CHANGELOG\.md|\.github/PULL_REQUEST_TEMPLATE\.md)$
