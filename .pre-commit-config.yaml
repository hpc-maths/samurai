repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # - id: check-added-large-files
      - id: check-case-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: no-commit-to-branch
      - id: mixed-line-ending
        args: ["--fix=lf"]
        description: Forces to replace line ending by the UNIX 'lf' character.
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.5
    hooks:
      - id: forbid-tabs
      - id: remove-tabs
        args: [--whitespaces-count, "4"]
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.2
    hooks:
      - id: clang-format
        files: .*\.[hc]pp$
        # Demo files included in the docs are formatted at 71 columns to
        # fit a code block: this hook skips them and the next one formats
        # them with demos/.clang-format-docs. Add a file to the list when
        # a page starts including it. demos/tutorial has its own
        # .clang-format instead.
        exclude: &docs_demos |
          (?x)^demos/(
            FiniteVolume/diff_heated_cavity\.cpp|
            FiniteVolume/heat\.cpp|
            FiniteVolume/level_set_AMR\.cpp|
            FiniteVolume/level_set_schemes\.hpp|
            FiniteVolume/linear_convection_obstacle\.cpp|
            FiniteVolume/nagumo\.cpp|
            LBM/new_D1Q3_shallow_waters_dam\.cpp|
            LBM/new_D2Q4444_euler_implosion\.cpp|
            LBM/new_D2Q4_advection\.cpp|
            LBM/new_D2Q9_von_karman\.cpp
          )$
      - id: clang-format
        name: clang-format (demos included in the docs)
        alias: clang-format-docs
        files: *docs_demos
        args: ["--style=file:demos/.clang-format-docs"]
