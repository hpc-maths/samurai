<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14">
  <rect x="0" y="0" width="680" height="300" rx="8" fill="#ffffff"/>

  <!-- Row 1: the mesh -->
  <text x="20" y="28" fill="#222222" font-weight="bold">Mesh</text>
  <g stroke-width="1.5">
    <g fill="#dbe7f5" stroke="#2f5d9b">
      <rect x="60" y="44" width="35" height="36"/>
      <rect x="95" y="44" width="35" height="36"/>
      <rect x="130" y="44" width="35" height="36"/>
      <rect x="165" y="44" width="35" height="36"/>
      <rect x="200" y="44" width="35" height="36"/>
      <rect x="235" y="44" width="35" height="36"/>
      <rect x="270" y="44" width="35" height="36"/>
      <rect x="305" y="44" width="35" height="36"/>
    </g>
    <g fill="#fbe3cf" stroke="#b5561a">
      <rect x="340" y="44" width="140" height="36"/>
      <rect x="480" y="44" width="140" height="36"/>
    </g>
  </g>
  <g fill="#222222" text-anchor="middle" font-size="13">
    <text x="77.5" y="67">0</text>
    <text x="112.5" y="67">1</text>
    <text x="147.5" y="67">2</text>
    <text x="182.5" y="67">3</text>
    <text x="217.5" y="67">4</text>
    <text x="252.5" y="67">5</text>
    <text x="287.5" y="67">6</text>
    <text x="322.5" y="67">7</text>
    <text x="410" y="67">2</text>
    <text x="550" y="67">3</text>
  </g>
  <g fill="#444444" text-anchor="middle" font-size="13">
    <text x="200" y="100">level 4</text>
    <text x="480" y="100">level 2</text>
  </g>

  <!-- Row 2: one entry per cell -->
  <text x="20" y="140" fill="#222222" font-weight="bold">One entry per cell: 10 entries</text>
  <g stroke-width="1.2">
    <g fill="#dbe7f5" stroke="#2f5d9b">
      <rect x="20" y="152" width="56" height="28" rx="3"/>
      <rect x="82" y="152" width="56" height="28" rx="3"/>
      <rect x="144" y="152" width="56" height="28" rx="3"/>
      <rect x="206" y="152" width="56" height="28" rx="3"/>
      <rect x="268" y="152" width="56" height="28" rx="3"/>
      <rect x="330" y="152" width="56" height="28" rx="3"/>
      <rect x="392" y="152" width="56" height="28" rx="3"/>
      <rect x="454" y="152" width="56" height="28" rx="3"/>
    </g>
    <g fill="#fbe3cf" stroke="#b5561a">
      <rect x="536" y="152" width="56" height="28" rx="3"/>
      <rect x="598" y="152" width="56" height="28" rx="3"/>
    </g>
  </g>
  <g fill="#222222" text-anchor="middle" font-size="13">
    <text x="48" y="171">(4, 0)</text>
    <text x="110" y="171">(4, 1)</text>
    <text x="172" y="171">(4, 2)</text>
    <text x="234" y="171">(4, 3)</text>
    <text x="296" y="171">(4, 4)</text>
    <text x="358" y="171">(4, 5)</text>
    <text x="420" y="171">(4, 6)</text>
    <text x="482" y="171">(4, 7)</text>
    <text x="564" y="171">(2, 2)</text>
    <text x="626" y="171">(2, 3)</text>
  </g>

  <!-- Row 3: one entry per interval -->
  <text x="20" y="226" fill="#222222" font-weight="bold">One entry per interval and level: 2 entries</text>
  <g stroke-width="1.2">
    <rect x="20" y="238" width="180" height="32" rx="3" fill="#dbe7f5" stroke="#2f5d9b"/>
    <rect x="216" y="238" width="180" height="32" rx="3" fill="#fbe3cf" stroke="#b5561a"/>
  </g>
  <g fill="#222222" text-anchor="middle" font-size="14">
    <text x="110" y="259">level 4: [0, 8)</text>
    <text x="306" y="259">level 2: [2, 4)</text>
  </g>
</svg>
