# SonarQube Cloud analysis of samurai, run by .github/workflows/sonar.yml.
# The scan of a pull request reads this file from the default branch, not from
# the pull request: a change here takes effect once it is merged.

sonar.organization=hpc-maths
sonar.projectKey=hpc-maths_samurai
sonar.projectName=samurai
sonar.sourceEncoding=UTF-8

# Analysis scope. samurai is header-only: the C++ analyzer reaches the headers
# of include/ through the files of the compilation database (tests, demos,
# benchmarks, documentation snippets and tools).
sonar.sources=include,demos,benchmark,python,tools,cmake,docs/source,conanfile.py,.github
sonar.tests=tests,tools/paraview/tests,tools/yt/tests
sonar.exclusions=tools/*/tests/**,**/build/**,**/*_output.txt
sonar.test.exclusions=tests/reference/**

# Coverage is measured on the library and its Python tools. Demos, benchmarks,
# snippets and CI files are not run under coverage; counting them would hold
# every pull request that touches them below the coverage threshold.
sonar.coverage.exclusions=demos/**,benchmark/**,docs/**,.github/**,conanfile.py

# Files written by the coverage job (.github/workflows/coverage.yml) and put
# in place by the scan job.
sonar.cfamily.compile-commands=sonar-inputs/compile_commands.json
sonar.coverageReportPaths=sonar-inputs/cpp-coverage.xml
sonar.python.coverage.reportPaths=sonar-inputs/python-coverage.xml
